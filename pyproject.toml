[build-system]
requires = [
    "scikit-build-core>=1.0,<2",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"


[project]
name = "robometrics"
version = "0.2.0"
description = "Robot motion planning datasets, metrics, and ESDF utilities"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.26.4",
    "PyYAML>=6.0",
]

license = "MIT"
license-files = ["LICENSE", "Licenses"]


[tool.scikit-build]
wheel.packages = ["robometrics"]

# 如果 C++ 源码放到 robometrics/cpp/，
# 不需要把 .cpp 源码塞进 binary wheel。
wheel.exclude = [
    "robometrics/cpp/**",
]

# 明确保证源码包可以重新构建 wheel。
sdist.include = [
    "CMakeLists.txt",
    "robometrics/**/*.py",
    "robometrics/cpp/*.cpp",
    "robometrics/content/**/*.yaml",
    "robometrics/content/**/*.yml",
    "tests/**/*.py",
    "README.md",
    "LICENSE",
    "Licenses",
]

# Keep local native builds and Python caches out of source archives.
sdist.exclude = [
    "**/*.so",
    "**/*.pyd",
    "**/*.dll",
    "**/*.dylib",
    "**/*.o",
    "**/*.obj",
    "**/*.pyc",
    "**/__pycache__/**",
]
